.field label{font:600 12px var(--body);color:var(--muted)}
.field input,.field select,.field textarea{font:500 14px var(--body);padding:9px 11px;border:1px solid var(--line2);border-radius:var(--r);background:var(--surface);color:var(--fg);width:100%;transition:border-color .12s,box-shadow .12s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);outline:none}
.field textarea{min-height:84px;resize:vertical}
.field input[type=range]{padding:0;accent-color:var(--accent);border:0;box-shadow:none}
.prow{display:flex;gap:10px;align-items:center}
.prow output{font-family:var(--mono);width:44px;text-align:right}
.panel .foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:auto;padding-top:14px;border-top:1px solid var(--line);position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));background:var(--surface);padding-bottom:4px}
.panel .foot div{display:flex;gap:8px}
.drop{border:2px dashed var(--line2);border-radius:var(--rl);padding:30px;text-align:center;color:var(--muted);background:var(--sunk);cursor:pointer;transition:border-color .12s,background .12s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{color:var(--fg)}
.steps{margin:0;padding-left:18px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:5px}
.steps code{font-family:var(--mono);font-size:12px;color:var(--fg);background:var(--sunk);padding:1px 5px;border-radius:5px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;z-index:30;font-size:13px;font-weight:600;max-width:calc(100% - 32px);box-shadow:var(--sh-lg)}
.err{color:var(--bad);font-size:13px}
@media (prefers-reduced-motion:no-preference){.panel{animation:slide .22s cubic-bezier(.2,.8,.2,1)}@keyframes slide{from{transform:translateX(30px);opacity:.5}}.toast{animation:pop .2s ease-out}@keyframes pop{from{transform:translate(-50%,8px);opacity:0}}}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
@media (max-width:1560px){#btnSearch .lbl,#btnImport .lbl,#btnExport .lbl{display:none}}

<script>
(function(){
const STATUS=[
  {k:"pending",l:"Open / not started",c:"var(--hold)"},
  {k:"progress",l:"In progress",c:"var(--info)"},
  {k:"qa",l:"Testing / QA",c:"var(--warn)"},
  {k:"uat",l:"UAT",c:"var(--lms)"},
  {k:"done",l:"Completed",c:"var(--ok)"},
  {k:"hold",l:"On hold / Blocked",c:"var(--bad)"}];
const SMAP=Object.fromEntries(STATUS.map(s=>[s.k,s]));
const PRIOS=["Critical","High","Medium","Low"];
const PCOL={Critical:"var(--bad)",High:"var(--warn)",Medium:"var(--info)",Low:"var(--hold)"};
const TYPES=["Screen","Report","Process","Feature","Screen / Form","Report","Integration / API","Workflow / Approval","Add-on","Data migration","Enhancement","Bug fix"];
const MOD_COLORS={"SAP B1":"var(--sap)","ATS":"var(--ats)","CRM":"var(--crm)","LMS":"var(--lms)","ERAM HCM":"var(--hcm)","HCM":"var(--hcm)","ERAM Workforce":"var(--wfc)"};
const DEFAULT_MODULES=[
  {name:"SAP B1",code:"SAP",full:"SAP Business One customisation"},
  {name:"ATS",code:"ATS",full:"Applicant Tracking System"},
  {name:"CRM",code:"CRM",full:"Customer Relationship Management"},
  {name:"LMS",code:"LMS",full:"Learning Management System"}];

const S={modules:[],developers:[],items:[],users:[],companies:[],licenses:[],daily:[],rollout:[],standup:[],reminders:[],issues:[],meetings:[],milestones:[],changes:[],releases:[],risks:[],manuals:[],assets:null,hd:"",members:[],settings:[],audit:[],me:null,meReady:false,user:null,dd:{date:"",proj:"",comp:""},sel:new Set(),uf:{q:"",app:"",dept:"",comp:""},lf:{sw:""},loaded:{modules:false,developers:false,items:false,users:false,companies:false,licenses:false,daily:false,rollout:false},
  db:null,dl:null,sample:false,tab:"home",view:"board",f:{q:"",mod:"",sub:"",type:"",dev:"",status:"",prio:""},lim:300,local:false};
try{const v=JSON.parse(localStorage.getItem("dev360ui")||"{}");if(v.view)S.view=v.view;}catch(e){}
function saveUI(){try{localStorage.setItem("dev360ui",JSON.stringify({tab:S.tab,view:S.view}))}catch(e){}}
const hashTab=(location.hash||"").slice(1);
if(["home","approvals","uat","plan","reports","health","chat","issues","workload","calendar","reminders","admin","daily","overview","tasks","developers","users","licences","modules","delivered","manuals","panel"].includes(hashTab))S.tab=hashTab;

const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtD=d=>{if(!d)return"";const x=new Date(d+"T00:00:00");if(isNaN(x))return esc(d);return x.toLocaleDateString(undefined,{day:"2-digit",month:"short",year:"2-digit"})};
const initials=n=>(n||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

// ----- data access
const data=()=>S.sample?SAMPLE:S;
const modById=id=>data().modules.find(m=>m.id===id);
const devById=id=>data().developers.find(d=>d.id===id);
const modColor=m=>m?(MOD_COLORS[m.name]||m.color||"var(--other)"):"var(--other)";
const isOver=i=>i.status!=="done"&&i.due&&i.due<today();
const itemKey=i=>{const m=modById(i.module);const c=m?.code||"GEN";return i.sno!==""&&i.sno!=null?c+"-"+String(i.sno).padStart(3,"0"):c+"-"+(i.id||"").slice(-4).toUpperCase()};
const devsOf=i=>Array.isArray(i.assignees)&&i.assignees.length?i.assignees:(i.assignee?[i.assignee]:[]);
const hasDev=(i,id)=>devsOf(i).includes(id);
const devNames=i=>devsOf(i).map(id=>devById(id)?.name).filter(Boolean).join(" & ");
const W={pending:0,progress:50,qa:75,uat:90,hold:25,done:100};
const progOf=i=>i.status==="done"?100:(i.progress===""||i.progress==null?(W[i.status]??0):(+i.progress||0));

// ----- sample (in-memory only, never saved)
const SAMPLE=(()=>{const t=today();const add=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
  const modules=DEFAULT_MODULES.map((m,i)=>({id:"m"+i,...m,lead:"",target:add(60+i*30),phase:["Development","Development","Design","Planning"][i]}));
  const developers=[{id:"d1",name:"Example Dev A",role:"SAP B1 Consultant / Developer"},{id:"d2",name:"Example Dev B",role:"Full-stack Developer"},{id:"d3",name:"Example Dev C",role:"Frontend Developer"},{id:"d4",name:"Example Dev D",role:"QA Engineer"}];
  const it=(title,mi,type,dev,status,prio,progress,start,due,extra={})=>({id:"s"+Math.random().toString(36).slice(2,8),title,module:"m"+mi,type,assignee:dev,assignees:[dev],status,priority:prio,progress,start,due,...extra});
  const items=[
    it("Sales approval workflow (multi-level)",0,"Workflow / Approval","d1","progress","High",60,add(-12),add(6)),
    it("Customer aging report (Crystal)",0,"Report","d1","done","Medium",100,add(-30),add(-10),{completed:add(-11),version:"v1.0"}),
    it("Service Layer API for HR sync",0,"Integration / API","d2","qa","High",85,add(-20),add(-2)),
    it("UDF set for project costing",0,"Enhancement","d1","pending","Low",0,add(5),add(15)),
    it("Candidate pipeline board",1,"Screen / Form","d3","progress","Critical",45,add(-8),add(10)),
    it("CV parsing + search",1,"Feature","d2","uat","High",90,add(-25),add(3)),
    it("Job posting module",1,"Feature","d3","done","High",100,add(-40),add(-15),{completed:add(-14),version:"v0.9"}),
    it("Interview scheduling",1,"Feature","d2","pending","Medium",0,add(7),add(25)),
    it("Lead capture + assignment rules",2,"Feature","d3","progress","Medium",30,add(-5),add(20)),
    it("Customer master sync with SAP B1",2,"Integration / API","d2","hold","High",20,add(-15),add(-4),{notes:"Waiting on BP field mapping sign-off"}),
    it("Course catalogue & enrolment",3,"Feature","d3","pending","Medium",0,add(14),add(45)),
    it("Regression test pack — ATS",1,"Feature","d4","progress","Medium",50,add(-6),add(8))];
  const U=(name,dept,email,apps)=>({id:"u"+Math.random().toString(36).slice(2,8),name,dept,email,designation:"",status:"Active",apps:Object.fromEntries(apps.map(([mi,role])=>["m"+mi,{role,on:add(-20)}]))});
  const users=[U("Example User 1","Finance","user1@example.com",[[0,"Accountant"],[2,"Viewer"]]),U("Example User 2","HR","user2@example.com",[[1,"Recruiter"],[3,"Admin"]]),U("Example User 3","Sales","user3@example.com",[[0,"Sales"],[2,"Sales rep"]]),U("Example User 4","Operations","user4@example.com",[[3,"Learner"]]),U("Example User 5","IT","user5@example.com",[[0,"Super user"],[1,"Admin"],[2,"Admin"],[3,"Admin"]])];
  return {modules,developers,items,users,companies:[],licenses:[],daily:[],rollout:[]};})();

// ----- render shell
function counts(){const d=data();return{tasks:d.items.length,developers:d.developers.length,users:d.users.length,licences:d.licenses.reduce((a,p)=>a+(+p.qty||0),0),modules:d.modules.length,delivered:d.items.filter(i=>i.status==="done").length}}
const IC={approvals:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',uat:'<path d="M12 22c5.5 0 10-4.5 10-10S17.5 2 12 2 2 6.5 2 12s4.5 10 10 10z"/><path d="m8 12 3 3 5-6"/><path d="M12 2v3"/>',plan:'<path d="M3 3v18h18"/><path d="M7 15h4M7 11h8M7 7h11"/>',reports:'<path d="M21 21H3V3"/><path d="m7 14 4-4 3 3 6-6"/>',health:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/>',issues:'<path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3z"/><path d="M12 9v4M12 17h.01"/>',workload:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>',reminders:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',admin:'<path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/>',daily:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8.5 15l2.5 2.5 4.5-4.5"/>',overview:'<path d="M4 20V11M10 20V5M16 20v-6M22 20H2"/>',tasks:'<path d="m9 11 3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',delivered:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',developers:'<path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/>',users:'<circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2M16 3.1a4 4 0 0 1 0 7.8M21 21v-2a4 4 0 0 0-3-3.9"/>',licences:'<circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.8-9.8M15.5 7.5l3 3M18 5l2.5 2.5"/>',modules:'<path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/>',panel:'<path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z"/><path d="m9 12 2 2 4-4"/>',manuals:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/><path d="M9 7h7M9 11h5"/>'};
const ico=k=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[k]||""}</svg>`;
const PAGES={home:["ERAM HCM Business Tools Development Stats","Developers' day-to-day activity, task status and all development at a glance"],approvals:["Approvals","Urgent work waiting for Admin or Project Manager approval"],uat:["UAT & sign-off","Developed items waiting for users to test and accept"],plan:["Plan & control","Milestones, change requests, releases, risks and dependencies"],reports:["Reports","Trends, delivery stages, issue performance and management summary"],health:["Data health","Gaps that make the status report less reliable, with bulk fixes"],chat:["Team chat","Internal communication by channel, with @mentions and issue links"],issues:["Urgent issues","Raise and track urgent issues by token number, with response-time targets"],workload:["Work on hand","What each developer is carrying now, and sharing or handing over work"],calendar:["Calendar","Meetings and discussions with users and developers, due dates, reminders and go-lives"],reminders:["Reminders","Reminders and messages to developers by email or WhatsApp"],admin:["Admin dashboard","Companies, licences and access across the Eram HCM group"],daily:["Eram HCM board","Software implementation by company, and today's status"],overview:["Development overview","Progress across SAP B1, ATS, CRM and LMS"],tasks:["Tasks & assignment","Every development item, who owns it and where it stands"],delivered:["Delivered software","Register of developed and completed items"],developers:["Developers","Workload and open items per developer"],users:["Users & access","Who uses which system, and on which licence"],licences:["Licences","Purchased, assigned and available licences, with renewals"],modules:["Projects","The systems under development"],panel:["Admin panel","Roles and permissions, lists, activity log and data control"],manuals:["User manuals","Guides by level (Admin ▸ Manager ▸ Developer), by project and module, with coverage of delivered software"]};
function renderTabs(){const c=counts();const G=[["Overview",[["home"],...(canManage()?[["approvals",approvalQueue().length||null]]:[]),["issues",openUrgent()||null],["calendar",(S.meetings||[]).filter(m=>m.date===today()&&m.status==="Planned").length||null],["reminders",dueCount()||null],["chat",unread()||null],["admin"],["daily"]]],["Delivery",[["overview"],["tasks",c.tasks],["workload"],["uat",data().items.filter(i=>i.status==="done"&&!isAccepted(i)).length||null],["plan"],["reports"],["delivered",c.delivered],["manuals",(S.manuals||[]).filter(m=>myLevels().includes(levelOf(m))).length||null]]],["People & access",[["developers",c.developers],["users",c.users],["licences",c.licences]]],["Setup",[["modules",c.modules],...(canManage()?[["health",healthChecks().reduce((a,x)=>a+(x[2].length?1:0),0)||null]]:[]),...(isAdmin()?[["panel"]]:[])]]];
  $("#tabs").innerHTML=G.map(([g,items])=>`<div class="grp">${g}</div>`+items.map(([k,n])=>`<button type="button" data-tab="${k}" ${S.tab===k?'aria-current="page"':""}>${ico(k)}<span>${k==="home"?"Development stats":PAGES[k][0]}</span>${n!=null?`<span class="ct">${n}</span>`:""}</button>`).join("")).join("");
  const pg=PAGES[S.tab]||PAGES.home;$("#pageTitle").textContent=pg[0];$("#pageSub").textContent=pg[1];document.title=pg[0]+" · ERAM HCM Business Tools";}
document.addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b){S.tab=b.dataset.tab;saveUI();document.body.classList.remove("navopen");render();window.scrollTo(0,0)}});
$("#btnMenu").onclick=()=>document.body.classList.add("navopen");$("#navScrim").onclick=()=>document.body.classList.remove("navopen");
function applyTheme(t){const r=document.documentElement;if(t==="light"||t==="dark")r.setAttribute("data-theme",t);else r.removeAttribute("data-theme");document.querySelectorAll("[data-theme-set]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.themeSet===(t||"auto"))))}
let THEME="auto";try{THEME=localStorage.getItem("dev360theme")||"auto"}catch(e){}applyTheme(THEME);
document.querySelectorAll("[data-theme-set]").forEach(x=>x.onclick=()=>{THEME=x.dataset.themeSet;try{localStorage.setItem("dev360theme",THEME)}catch(e){}applyTheme(THEME)});

function render(){const kn=$("#dn_save")?.dataset.nid;const keep={};["dn_done","dn_block","dn_next"].forEach(id=>{const el=$("#"+id);if(el&&el.dataset.dirty)keep[id]=el.value});const fid=document.activeElement?.id;
  renderTabs();const m=$("#main");let h="";
  const allLoaded=S.loaded.modules&&S.loaded.developers&&S.loaded.items;
  if(S.meReady&&!S.local&&!canManage()){const r=myRole();const dv=devById(myDevId());h+=`<div class="banner" style="background:color-mix(in srgb,${ROLE_C[r]} 10%,var(--surface));border-color:color-mix(in srgb,${ROLE_C[r]} 35%,transparent)"><span class="chip" style="--c:${ROLE_C[r]}">${r}</span><span>${r==="Developer"?(dv?`You can update items assigned to <b>${esc(dv.name)}</b> and write daily status notes.`:"Your account isn't linked to a developer yet, so you can't change items. Ask an admin to link it."):"You have read-only access. Ask an admin if you need to make changes."}</span></div>`}
  if(S.local)h+=`<div class="banner warn"><b>Preview mode.</b> Changes here are not saved. Sign in to save changes and share the tracker with your team.</div>`;
  if(S.sample)h+=`<div class="banner"><b>Showing example data.</b> Nothing here is saved. <button class="btn" type="button" id="sampleOff">Hide examples</button></div>`;
  else if(allLoaded&&!S.items.length&&!S.developers.length)h+=`<div class="banner"><span>No tasks yet. Upload your existing Excel/CSV list, add developers and tasks by hand, or look around with example data first.</span><button class="btn" type="button" id="sampleOn">Show example data</button></div>`;
  h+=({approvals:vApprovals,uat:vUat,plan:vPlan,reports:vReports,health:vHealth,chat:vChat,issues:vIssues,workload:vWorkload,calendar:vCalendar,reminders:vReminders,home:vHome,panel:vPanel,admin:vAdmin,daily:vDaily,overview:vOverview,tasks:vTasks,developers:vDevelopers,users:vUsers,licences:vLicences,modules:vModules,delivered:vDelivered,manuals:vManuals}[S.tab]||vOverview)();
  m.innerHTML=h;
  if(kn&&$("#dn_save")?.dataset.nid===kn){Object.entries(keep).forEach(([id,v])=>{const el=$("#"+id);if(el){el.value=v;el.dataset.dirty="1"}});if(fid&&/^dn_/.test(fid))$("#"+fid)?.focus()}
  ["dn_done","dn_block","dn_next"].forEach(id=>$("#"+id)?.addEventListener("input",e=>e.target.dataset.dirty="1"));
  $("#sampleOn")?.addEventListener("click",()=>{S.sample=true;render()});
  $("#sampleOff")?.addEventListener("click",()=>{S.sample=false;render()});
  bindView();bindPanel();bindNotify();bindIssues();bindChat();bindUat();bindManuals();$("#rp_p")?.addEventListener("change",e=>{S.rpp=e.target.value;render()});
  $("#btnImport").hidden=!canManage();$("#btnNew").hidden=myRole()==="Viewer";}

function statusChip(k){const s=SMAP[k]||SMAP.pending;return `<span class="chip" style="--c:${s.c}"><span class="dot"></span>${s.l}</span>`}
function prioChip(p){return p?`<span class="chip" style="--c:${PCOL[p]||"var(--muted)"}">${esc(p)}</span>`:""}
function modTag(id){const m=modById(id);return m?`<span class="mtag" style="--mc:${modColor(m)}">${esc(m.name)}</span>`:`<span class="mtag" style="--mc:var(--other)">—</span>`}
function segbar(list){const n=list.length||1;return `<div class="segbar">${STATUS.map(s=>{const c=list.filter(i=>i.status===s.k).length;return c?`<i style="width:${c/n*100}%;background:${s.c}" title="${s.l}: ${c}"></i>`:""}).join("")}</div>`}
const pctOf=list=>list.length?Math.round(list.reduce((a,i)=>a+progOf(i),0)/list.length):0;

// ----- Overview
function vOverview(){const d=data(),I=d.items;
  const k=[[I.length,"Total items"],[I.filter(i=>i.status==="progress"||i.status==="qa"||i.status==="uat").length,"Ongoing"],[I.filter(i=>i.status==="pending").length,"Pending start"],[I.filter(i=>i.status==="done").length,"Developed"],[I.filter(i=>i.acceptStatus==="Accepted").length,"User accepted"],[I.filter(isOver).length,"Overdue",1],[pctOf(I)+"%","Overall progress"]];
  let h=`<p class="eyebrow">Portfolio · as of ${fmtD(today())}</p><div class="kpis">${k.map(([n,l,b])=>`<div class="kpi ${b&&n?"bad":""}"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("")}</div>`;
  h+=`<h2 class="sec">Projects</h2>`;
  if(!d.modules.length)h+=empty("No projects yet","Projects load automatically on first open.");
  else h+=`<div class="modgrid">${d.modules.map(m=>{const L=I.filter(i=>i.module===m.id);const devs=new Set(L.filter(i=>i.status!=="done").flatMap(devsOf));
    const nextDue=L.filter(i=>i.status!=="done"&&i.due).sort((a,b)=>a.due<b.due?-1:1)[0];
    return `<div class="mod" style="--mc:${modColor(m)}"><h3>${esc(m.name)}<span class="pct">${pctOf(L)}%</span></h3>
      <div class="meta"><span>${esc(m.full||"")}</span>${m.phase?`<span>Phase: ${esc(m.phase)}</span>`:""}${m.target?`<span>Go-live ${fmtD(m.target)}</span>`:""}</div>
      ${segbar(L)}<div class="legend">${STATUS.map(s=>{const c=L.filter(i=>i.status===s.k).length;return c?`<span><i class="dot" style="background:${s.c}"></i>${s.l} ${c}</span>`:""}).join("")||"<span>No items yet</span>"}</div>
      <div class="meta"><span>${L.length} items</span><span>${devs.size} developer${devs.size===1?"":"s"} active</span>${L.filter(isOver).length?`<span style="color:var(--bad)">${L.filter(isOver).length} overdue</span>`:""}${nextDue?`<span>Next due ${fmtD(nextDue.due)}</span>`:""}</div></div>`}).join("")}</div>`;
  const withSub=d.modules.filter(m=>I.some(i=>i.module===m.id&&i.subModule));
  if(withSub.length){h+=`<h2 class="sec">Module status report</h2><div class="tablewrap"><table><thead><tr><th>Project</th><th>Module</th><th class="num">Total</th><th class="num">Screens</th><th class="num">Reports</th><th class="num">Process</th><th class="num">Developed</th><th class="num">In progress</th><th class="num">Open</th><th class="num">EU tested</th><th class="num">Accepted</th><th style="min-width:140px">Progress</th></tr></thead><tbody>`;
    withSub.forEach(m=>{const L=I.filter(i=>i.module===m.id);const subs=subsOf(L).concat(L.some(i=>!i.subModule)?[""]:[]);
      subs.forEach((sb,ix)=>{const G=L.filter(i=>(i.subModule||"")===sb);const r=sumRow(m.name,sb,G);const pc=pctOf(G);
        h+=`<tr class="click" data-sub="${esc(m.id)}|${esc(sb)}"><td>${ix===0?modTag(m.id):""}</td><td><b style="font-weight:500">${esc(sb||"(no module)")}</b></td><td class="num">${r.Total}</td><td class="num muted">${r.Screens}</td><td class="num muted">${r.Reports}</td><td class="num muted">${r.Process}</td><td class="num">${r["Dev Completed"]}</td><td class="num" style="${r["Dev In-Progress"]?"color:var(--info);font-weight:600":""}">${r["Dev In-Progress"]}</td><td class="num" style="${r["Dev Open"]?"color:var(--warn);font-weight:600":""}">${r["Dev Open"]}</td><td class="num">${r["EU Testing Completed"]}</td><td class="num">${r["EU Accepted"]}</td><td><div class="load"><div class="bar"><i style="width:${pc}%;background:${modColor(m)}"></i></div><span class="mono" style="font-size:12px;width:36px;text-align:right">${pc}%</span></div></td></tr>`});
      const t=sumRow(m.name,"",L);h+=`<tr style="background:var(--sunk)"><td></td><td><b>Total ${esc(m.name)}</b></td>${["Total","Screens","Reports","Process","Dev Completed","Dev In-Progress","Dev Open","EU Testing Completed","EU Accepted"].map(k=>`<td class="num"><b>${t[k]}</b></td>`).join("")}<td class="mono"><b>${pctOf(L)}%</b></td></tr>`});
    h+=`</tbody></table></div>`;}
  h+=`<div class="two"><div><h2 class="sec">Developer workload</h2>`;
  if(!d.developers.length)h+=empty("No developers yet","Add your team to start assigning work.",`<button class="btn primary" type="button" data-act="newDev">+ Add developer</button>`);
  else{const max=Math.max(1,...d.developers.map(v=>I.filter(i=>hasDev(i,v.id)&&i.status!=="done"&&i.status!=="pending").length));
    h+=`<div class="tablewrap"><table><thead><tr><th>Developer</th><th class="num">Total</th><th class="num">Ongoing</th><th class="num">Open</th><th class="num">Done</th><th class="num">Overdue</th><th>Load</th></tr></thead><tbody>${d.developers.map(v=>{const L=I.filter(i=>hasDev(i,v.id));const on=L.filter(i=>["progress","qa","uat","hold"].includes(i.status)).length;const ov=L.filter(isOver).length;
      return `<tr class="click" data-dev="${v.id}"><td><b>${esc(v.name)}</b><div class="muted" style="font-size:12px">${esc(v.role||"")}</div></td><td class="num">${L.length}</td><td class="num">${on}</td><td class="num">${L.filter(i=>i.status==="pending").length}</td><td class="num">${L.filter(i=>i.status==="done").length}</td><td class="num" style="${ov?"color:var(--bad);font-weight:600":""}">${ov}</td><td><div class="load"><div class="bar"><i style="width:${on/max*100}%"></i></div></div></td></tr>`}).join("")}
      ${I.some(i=>!devsOf(i).length&&i.status!=="done")?`<tr><td class="muted">Unassigned</td><td></td><td class="num">${I.filter(i=>!devsOf(i).length&&i.status!=="done"&&i.status!=="pending").length}</td><td class="num">${I.filter(i=>!devsOf(i).length&&i.status==="pending").length}</td><td></td><td></td><td></td></tr>`:""}</tbody></table></div>`;}
  h+=`</div><div><h2 class="sec">Needs attention</h2>`;
  const att=I.filter(i=>i.status!=="done"&&(isOver(i)||i.status==="hold"||(i.due&&i.due<=addDays(7))||(i.priority==="Critical"))).sort((a,b)=>(isOver(b)-isOver(a))||((a.due||"9")<(b.due||"9")?-1:1)).slice(0,10);
  if(!att.length)h+=empty("Nothing flagged","Overdue, blocked, critical and due-this-week items appear here.");
  else h+=`<div class="alist">${att.map(i=>{const c=isOver(i)||i.status==="hold"?"var(--bad)":i.priority==="Critical"?"var(--warn)":"var(--info)";const why=isOver(i)?"Overdue":i.status==="hold"?"On hold / blocked":i.priority==="Critical"?"Critical":"Due this week";
    return `<div class="aitem" data-item="${i.id}" style="--c:${c}"><span class="stripe"></span><div style="min-width:0"><div class="t">${esc(i.title)}</div><div class="s">${why} · ${esc(devNames(i)||"Unassigned")}${i.due?` · due ${fmtD(i.due)}`:""}</div></div>${modTag(i.module)}</div>`}).join("")}</div>`;
  h+=`</div></div>`;return h;}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function empty(t,s,btn=""){return `<div class="empty"><b>${t}</b>${s}${btn?`<div>${btn}</div>`:""}</div>`}

// ----- Tasks
const TCOL={"Completed":"var(--ok)","Accepted":"var(--ok)","Ongoing":"var(--warn)","Partially completed":"var(--warn)","Pending":"var(--warn)","Open":"var(--hold)","Live":"var(--ok)"};
function vChip(v){return v?`<span class="chip" style="--c:${TCOL[v]||"var(--info)"}">${esc(v)}</span>`:`<span class="muted">—</span>`}
function subsOf(list){return [...new Set(list.map(i=>i.subModule).filter(Boolean))].sort()}
function filtered(){const d=data(),f=S.f,q=f.q.trim().toLowerCase();return d.items.filter(i=>(!f.mod||i.module===f.mod)&&(!f.sub||i.subModule===f.sub)&&(!f.type||i.type===f.type)&&(!f.dev||(f.dev==="_none"?!devsOf(i).length:hasDev(i,f.dev)))&&(!f.status||(f.status==="_over"?isOver(i):f.status==="_notacc"?(i.status==="done"&&i.acceptStatus!=="Accepted"):i.status===f.status))&&(!f.prio||i.priority===f.prio)&&(!q||[i.title,i.description,i.notes,i.type,i.subModule,i.branch,i.endUsers,itemKey(i),i.sno].join(" ").toLowerCase().includes(q))).sort((a,b)=>(a.module||"").localeCompare(b.module||"")||((+a.sno||1e9)-(+b.sno||1e9)))}
function vTasks(){const d=data(),f=S.f;const types=[...new Set([...TYPES,...d.items.map(i=>i.type).filter(Boolean)])];
  let h=`<div class="filters"><input id="fq" type="search" placeholder="Search details, S.No, branch, end users…" value="${esc(f.q)}">
   <select id="fmod"><option value="">All projects</option>${d.modules.map(m=>`<option value="${m.id}" ${f.mod===m.id?"selected":""}>${esc(m.name)}</option>`).join("")}</select>
   <select id="fsub"><option value="">All modules</option>${subsOf(d.items.filter(i=>!f.mod||i.module===f.mod)).map(s=>`<option ${f.sub===s?"selected":""}>${esc(s)}</option>`).join("")}</select>
   <select id="ftype"><option value="">All req. types</option>${types.map(t=>`<option ${f.type===t?"selected":""}>${esc(t)}</option>`).join("")}</select>
   <select id="fdev"><option value="">All developers</option><option value="_none" ${f.dev==="_none"?"selected":""}>Unassigned</option>${d.developers.map(v=>`<option value="${v.id}" ${f.dev===v.id?"selected":""}>${esc(v.name)}</option>`).join("")}</select>
   <select id="fst"><option value="">All dev. statuses</option>${STATUS.map(s=>`<option value="${s.k}" ${f.status===s.k?"selected":""}>${s.l}</option>`).join("")}<option value="_over" ${f.status==="_over"?"selected":""}>Overdue</option><option value="_notacc" ${f.status==="_notacc"?"selected":""}>Developed, not yet accepted</option></select>
   <select id="fpr"><option value="">All priorities</option>${PRIOS.map(p=>`<option ${f.prio===p?"selected":""}>${p}</option>`).join("")}</select>
   ${canManage()&&!S.sample?`<button class="btn" type="button" id="renum" title="Number tasks 1, 2, 3… in each project, keeping their current order">#&nbsp;Renumber S.No</button>`:""}<span class="seg"><button type="button" data-view="table" aria-pressed="${S.view==="table"}">Report</button><button type="button" data-view="board" aria-pressed="${S.view==="board"}">Board</button></span></div>`;
  const L=filtered();
  if(!d.items.length)return h+empty("No tasks yet","Create a task and assign it to a developer, or upload your existing status report.",`<button class="btn primary" type="button" data-act="newTask">+ New task</button> <button class="btn" type="button" data-act="import">⇪ Upload data</button>`);
  h+=`<p class="muted" style="margin:0 0 8px;font-size:12px">${L.length} of ${d.items.length} items</p>`;
  if(S.view==="board"){const B=L.slice(0,600);h+=`<div class="board">${STATUS.map(s=>{const C=B.filter(i=>(i.status||"pending")===s.k);return `<div class="col"><h4><span><i class="dot" style="background:${s.c}"></i>${s.l}</span><span class="mono">${C.length}</span></h4>${C.slice(0,80).map(taskCard).join("")}${C.length>80?`<div class="muted" style="font-size:12px;padding:4px">+${C.length-80} more. Narrow the filters or use Report view.</div>`:""}</div>`}).join("")}</div>`;}
  else{const P=L.slice(0,S.lim||300);h+=`<div class="tablewrap"><table><thead><tr><th class="num">S.No</th><th>Module</th><th>Details</th><th>Req.Type</th><th>Requirement</th><th>Developer</th><th>Development</th><th>Company</th><th>Branch</th><th>End users</th><th>EU testing</th><th>EU acceptance</th><th>Project</th><th>Due</th></tr></thead><tbody>${P.map(i=>`<tr class="click" data-item="${i.id}"><td class="num mono muted">${esc(i.sno)}</td><td>${esc(i.subModule||"")}</td><td style="min-width:220px"><b style="font-weight:500">${esc(i.title)}</b>${apPending(i)?` <span class="chip" style="--c:var(--warn)">⏳ Approval</span>`:""}${i.signoff?` <span class="chip" style="--c:var(--ok)">✓ Signed off</span>`:""}</td><td class="muted">${esc(i.type||"")}</td><td>${vChip(i.reqStatus)}</td><td>${esc(devNames(i)||"—")}</td><td>${statusChip(i.status)}</td><td class="muted">${esc(i.company||"")}</td><td>${esc(i.branch||"")}</td><td class="muted">${esc(i.endUsers||"")}</td><td>${vChip(i.testStatus)}</td><td>${vChip(i.acceptStatus)}</td><td>${modTag(i.module)}</td><td class="mono due ${isOver(i)?"over":""}">${fmtD(i.due)}</td></tr>`).join("")||`<tr><td colspan="14" class="muted">No tasks match these filters.</td></tr>`}</tbody></table></div>${L.length>P.length?`<div style="margin-top:10px"><button class="btn" type="button" id="more">Show ${Math.min(300,L.length-P.length)} more of ${L.length-P.length}</button></div>`:""}`;}
  return h;}
function taskCard(i){const m=modById(i.module);const p=progOf(i);
  return `<div class="card" data-item="${i.id}" style="--mc:${modColor(m)}"><div class="r">${modTag(i.module)}<span class="mono">${itemKey(i)}</span></div>${i.subModule?`<div class="r"><span>${esc(i.subModule)}${i.type?` · ${esc(i.type)}`:""}</span>${i.acceptStatus==="Accepted"?`<span class="chip" style="--c:var(--ok)">Accepted</span>`:""}</div>`:""}<div class="t">${esc(i.title)}</div>${apPending(i)?`<span class="chip" style="--c:var(--warn);align-self:flex-start">⏳ Awaiting approval</span>`:""}<div class="prog"><i style="width:${p}%"></i></div><div class="r"><span>${esc(devNames(i)||"Unassigned")}</span>${prioChip(i.priority)}</div>${i.due?`<div class="r"><span class="due ${isOver(i)?"over":""}">Due ${fmtD(i.due)}${isOver(i)?" · overdue":""}</span><span class="mono">${p}%</span></div>`:""}</div>`}

// ----- Developers
function vDevelopers(){const d=data();let h=`<div class="filters"><span class="muted" style="flex:1">Every developer's ongoing, queued and finished work.</span><button class="btn primary" type="button" data-act="newDev">+ Add developer</button></div>`;
  if(!d.developers.length)return h+empty("No developers yet","Add each developer once; then assign tasks to them.");
  h+=`<div class="devgrid">${d.developers.map(v=>{const L=d.items.filter(i=>hasDev(i,v.id));const act=L.filter(i=>i.status!=="done").sort((a,b)=>STATUS.findIndex(s=>s.k===a.status)-STATUS.findIndex(s=>s.k===b.status));
    return `<div class="dev"><header><div class="av">${esc(initials(v.name))}</div><div style="flex:1;min-width:0"><div class="nm">${esc(v.name)}</div><div class="rl">${esc(v.role||"")}${v.email?` · ${esc(v.email)}`:""}</div></div><button class="btn" type="button" data-editdev="${v.id}">Edit</button></header>
    <div class="stats"><div><b>${L.filter(i=>["progress","qa","uat"].includes(i.status)).length}</b><span>Ongoing</span></div><div><b>${L.filter(i=>i.status==="pending").length}</b><span>Pending</span></div><div><b>${L.filter(i=>i.status==="done").length}</b><span>Done</span></div><div><b style="${L.filter(isOver).length?"color:var(--bad)":""}">${L.filter(isOver).length}</b><span>Overdue</span></div></div>
    ${act.length?`<ul>${act.slice(0,8).map(i=>`<li data-item="${i.id}"><i class="dot" style="background:${SMAP[i.status]?.c}"></i>${modTag(i.module)}<span class="tt">${esc(i.title)}</span><span class="mono muted due ${isOver(i)?"over":""}">${fmtD(i.due)}</span></li>`).join("")}${act.length>8?`<li class="muted" data-devtasks="${v.id}">+${act.length-8} more</li>`:""}</ul>`:`<div class="muted" style="font-size:13px">No open tasks.</div>`}</div>`}).join("")}</div>`;return h;}

// ----- Companies, licences & users: shared helpers
const appsOf=u=>u.apps&&typeof u.apps==="object"?u.apps:{};
const licOf=u=>u.lic&&typeof u.lic==="object"?u.lic:{};
const compById=id=>data().companies.find(c=>c.id===id);
const poolById=id=>data().licenses.find(p=>p.id===id);
const compName=id=>compById(id)?.name||"";
const compLabel=c=>c?(c.name+(c.country?` (${c.country})`:"")):"";
const sortedComps=()=>data().companies.slice().sort((a,b)=>(a.order??999)-(b.order??999)||String(a.name).localeCompare(b.name));
const UTYPES=["Business user","Developer","IT / Admin","Consultant"];
const isBiz=u=>!u.utype||u.utype==="Business user";
const AUD={endusers:"End users only",dev:"Development / test",all:"Any user"};
const countsFor=(p,u)=>p.audience!=="endusers"||isBiz(u);
const assignedCount=p=>data().users.filter(u=>licOf(u)[p.id]&&countsFor(p,u)).length;
const userPools=u=>Object.keys(licOf(u)).map(poolById).filter(Boolean);
const softwares=()=>[...new Set(data().licenses.slice().sort((a,b)=>(a.order??99)-(b.order??99)).map(p=>p.software).filter(Boolean))];
const poolsFor=sw=>data().licenses.filter(p=>p.software===sw).sort((a,b)=>(a.order??99)-(b.order??99)||String(a.type).localeCompare(b.type));
const daysTo=d=>d?Math.round((new Date(d+"T00:00:00")-new Date(today()+"T00:00:00"))/864e5):null;
function renewCell(p){const n=daysTo(p.renewal);if(n==null)return'<span class="muted">—</span>';const c=n<0?"var(--bad)":n<=60?"var(--warn)":"var(--fg)";return `<span class="mono" style="color:${c};${n<=60?"font-weight:600":""}">${fmtD(p.renewal)}</span>${n<0?` <span class="chip" style="--c:var(--bad)">Expired</span>`:n<=60?` <span class="chip" style="--c:var(--warn)">${n} days</span>`:""}`}
function utilBar(a,t){const pc=t?Math.min(100,Math.round(a/t*100)):(a?100:0);const c=a>t?"var(--bad)":pc>=90?"var(--warn)":"var(--accent)";return `<div class="load"><div class="bar"><i style="width:${pc}%;background:${c}"></i></div><span class="mono" style="font-size:12px;width:40px;text-align:right">${t?Math.round(a/t*100):0}%</span></div>`}
async function saveUser(u,patch){const o={...u,...patch};delete o.id;await put("users",u.id,o)}
async function runPool(tasks,onStep){let k=0,err=null,done=0;const w=async()=>{while(k<tasks.length&&!err){const t=tasks[k++];try{await t();done++;onStep&&onStep(done)}catch(e){err=e}}};await Promise.all(Array.from({length:6},w));if(err)throw err;return done}

// ----- Users & Access
function usersFiltered(){const d=data(),f=S.uf,q=f.q.trim().toLowerCase();return d.users.filter(u=>(!f.app||(f.app==="_none"?!Object.keys(appsOf(u)).some(k=>modById(k)):appsOf(u)[f.app]))&&(!f.dept||u.dept===f.dept)&&(!f.comp||(f.comp==="_none"?!u.company:u.company===f.comp))&&(!q||[u.name,u.email,u.dept,u.designation,u.branch,compName(u.company),...userPools(u).map(p=>p.type)].join(" ").toLowerCase().includes(q)))}

  h+=`<div class="filters"><input id="uq" type="search" placeholder="Search name, email, branch, licence…" value="${esc(f.q)}">
   <select id="ucomp"><option value="">All companies</option><option value="_none" ${f.comp==="_none"?"selected":""}>No company set</option>${sortedComps().map(c=>`<option value="${c.id}" ${f.comp===c.id?"selected":""}>${esc(compLabel(c))}</option>`).join("")}</select>
   <select id="uapp"><option value="">All applications</option>${d.modules.map(m=>`<option value="${m.id}" ${f.app===m.id?"selected":""}>Access to ${esc(m.name)}</option>`).join("")}<option value="_none" ${f.app==="_none"?"selected":""}>No application</option></select>
   <select id="udept"><option value="">All departments</option>${depts.map(x=>`<option ${f.dept===x?"selected":""}>${esc(x)}</option>`).join("")}</select>
   <button class="btn primary" type="button" data-act="newUser">+ Add user</button></div>`;
  if(!d.users.length)return h+empty("No application users yet","Add the people who use SAP B1, ATS, CRM and LMS, set their company, then tick which systems each one can use and which licence they hold. You can also upload a user list from Excel.",`<button class="btn primary" type="button" data-act="newUser">+ Add user</button> <button class="btn" type="button" data-act="import">⇪ Upload data</button>`);

   ${(r.log||[]).length?`<div class="field full"><label>History</label><div style="display:flex;flex-direction:column;gap:4px;font-size:13px">${r.log.slice().reverse().map(l=>`<div><span class="mono muted">${fmtD(l.d)}</span> · ${esc(ROM[l.from]?.l||"—")} → <b style="font-weight:600">${esc(ROM[l.to]?.l||l.to)}</b></div>`).join("")}</div></div>`:""}</form>
   <div class="foot"><span></span><div><button class="btn" type="button" id="ro_c">Cancel</button><button class="btn primary" type="button" id="ro_s">Save</button></div></div>`);

async function put(col,id,obj){if(!allowWrite(col,id,obj))throw roleErr();obj={...obj};delete obj.id;obj.updatedAt=new Date().toISOString();const existed=(S[col]||[]).some(x=>x.id===id);
  let saved=obj;
  if(S.db){saved=(await S.db.collection(col).doc(id).set(obj))||obj}
  else{if(col==="items"&&(obj.autoSno||!(+obj.sno>0))){obj.sno=nextSno(obj.module,id);delete obj.autoSno}const arr=S[col]||(S[col]=[]);const ix=arr.findIndex(x=>x.id===id);const rec={id,...obj};if(ix>=0)arr[ix]=rec;else arr.push(rec);render()}
  audit(existed?"update":"create",col,id,labelFor(col,obj,id));return saved}

  try{let r;if(S.db?.renumberItems)r=await S.db.renumberItems(proj||null);else{const L=(S.items||[]).filter(i=>!proj||i.module===proj);const by={};L.forEach(i=>(by[i.module||""]||=[]).push(i));let n=0;Object.values(by).forEach(G=>G.sort((a,b)=>((+a.sno||1e12)-(+b.sno||1e12))||String(a.createdAt||"").localeCompare(String(b.createdAt||""))).forEach((i,k)=>{if(i.sno!==k+1){i.sno=k+1;n++}}));r={changed:n,total:L.length};render()}
    auditNote(`Renumbered task S.No${proj?" in "+(modById(proj)?.name||"project"):" in all projects"}: ${r.changed} changed`);toast(r.changed?`Renumbered: ${r.changed} of ${r.total} tasks got a new S.No`:"Already in order, nothing changed")}catch(e){writeErr(e)}}

    const rows=XLSX.utils.sheet_to_json(wb.Sheets[tName],{defval:"",raw:true});
    const dName=wb.SheetNames.find(n=>/^developers?$|^team$|^resources?$/i.test(n.trim()));

    const g=(r,k)=>map[k]!=null?r[map[k]]:"";const s=(r,k)=>String(g(r,k)??"").trim();let shifted=0;
    const recs=map.title==null?[]:rows.map(r=>{let br=s(r,"branch"),eu=s(r,"endUsers"),te=s(r,"testStatus"),ac=s(r,"acceptStatus");
      if(map.branch!=null&&!br&&STV.has(norm(eu))&&ac&&!STV.has(norm(ac))){[br,te,ac,eu]=[ac,eu,te,""];shifted++}
      const st=normStatus(g(r,"status"));const sn=g(r,"sno");
      return{sno:sn===""||sn==null||isNaN(+sn)?"":+sn,ref:s(r,"ref"),title:s(r,"title").replace(/\s+/g," "),project:s(r,"project"),subModule:s(r,"subModule"),type:normType(g(r,"type")),reqStatus:normReq(g(r,"reqStatus")),developers:splitDevs(g(r,"developer")),status:st,company:s(r,"company"),branch:normBranch(br),endUsers:eu,testStatus:normTest(te),acceptStatus:normAcc(ac),priority:normPrio(g(r,"priority")),progress:normProg(g(r,"progress"),st),start:normDate(g(r,"start")),due:normDate(g(r,"due")),completed:normDate(g(r,"completed")),estHours:s(r,"est")?+s(r,"est")||"":"",version:s(r,"version"),description:s(r,"description"),notes:s(r,"notes")}}).filter(x=>x.title&&!/^\(?example row/i.test(x.title)&&!/example row: replace/i.test(x.title));

  r.readAsArrayBuffer(file);}

  const pk=(sw,t,c)=>norm(sw)+"|"+norm(t)+"|"+(c||"");const poolIdx=new Map(D.licenses.map(p=>[pk(p.software,p.type,p.company),p]));let lo=D.licenses.length;

  let h=`<div class="filters"><span class="seg" role="tablist">${AP_TABS.map(([k,l])=>`<button type="button" data-ap="${k}" aria-pressed="${t===k}">${l}</button>`).join("")}</span></div>`;
  h+=({team:apTeam,notify:apNotify,lists:apLists,log:apLog,data:apData}[t])();return h}
function personCell(id){return `<span class="who" data-uid="${esc(id)}" style="display:inline-flex;align-items:center;gap:8px"><span class="av" style="width:28px;height:28px;border-radius:9px;font-size:11px">··</span><span class="nm">Loading…</span></span>`}
async function fillPeople(){if(!S.user)return;const els=[...document.querySelectorAll(".who[data-uid]")];const ids=[...new Set(els.map(e=>e.dataset.uid).filter(Boolean))];if(!ids.length)return;
  let ps={};try{ps=await S.user.profiles(ids)}catch(e){}els.forEach(el=>{const p=ps[el.dataset.uid]||{};const nm=p.name||(p.isMe?"You":"Team member");const av=el.querySelector(".av");const n=el.querySelector(".nm");n.textContent=nm+(p.isMe&&p.name?" (you)":"");if(p.avatarUrl){av.textContent="";const im=document.createElement("img");im.src=p.avatarUrl;im.alt="";im.style.cssText="width:100%;height:100%;border-radius:9px;object-fit:cover";av.appendChild(im)}else av.textContent=initials(nm);if(p.guest)n.insertAdjacentHTML("afterend",' <span class="chip" style="--c:var(--warn)">Guest</span>')})}
function apTeam(){const M=(S.members||[]).slice().sort((a,b)=>ROLES.indexOf(a.role)-ROLES.indexOf(b.role));const d=data();
  let h=`<div class="two"><div><h2 class="sec" style="margin-top:0">Members</h2>
   <div class="tablewrap" style="overflow:visible"><div style="padding:12px;border-bottom:1px solid var(--line);position:relative"><input id="ap_search" type="search" placeholder="Add a person: search by name…" style="width:100%;font:500 13px var(--body);padding:9px 11px;border:1px solid var(--line2);border-radius:var(--r);background:var(--surface);color:var(--fg)" autocomplete="off"><div id="ap_results" class="alist" style="position:absolute;left:12px;right:12px;top:52px;z-index:5;max-height:260px;overflow:auto" hidden></div></div>
   <table><thead><tr><th>Person</th><th>Role</th><th>Linked developer</th><th>Status</th><th></th></tr></thead><tbody>
   ${S.me?.isOwner?`<tr><td>${personCell(S.me.id)}</td><td><span class="chip" style="--c:${ROLE_C.Admin}">Admin · owner</span></td><td class="muted">—</td><td><span class="chip" style="--c:var(--ok)">Active</span></td><td></td></tr>`:""}
   ${M.filter(m=>m.id!==S.me?.id||!S.me?.isOwner).map(m=>`<tr><td>${personCell(m.id)}</td><td><select data-mrole="${esc(m.id)}" style="font:600 13px var(--body);padding:6px 8px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);color:${ROLE_C[m.role]||"var(--fg)"}">${ROLES.map(r=>`<option ${m.role===r?"selected":""}>${r}</option>`).join("")}</select></td><td><select data-mdev="${esc(m.id)}" style="font:13px var(--body);padding:6px 8px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);color:var(--fg)"><option value="">—</option>${d.developers.map(v=>`<option value="${v.id}" ${m.devId===v.id?"selected":""}>${esc(v.name)}</option>`).join("")}</select></td><td><button class="btn" type="button" data-mact="${esc(m.id)}" style="padding:5px 10px">${m.active===false?"Suspended · reactivate":"Active · suspend"}</button></td><td><button class="btn danger" type="button" data-mdel="${esc(m.id)}" style="padding:5px 10px">Remove</button></td></tr>`).join("")}
   ${!M.length?`<tr><td colspan="5" class="muted">No members added yet. Search above to add people and give them a role.</td></tr>`:""}</tbody></table></div>
   <div class="field" style="margin-top:14px;max-width:420px"><label for="ap_def">Role for people not listed here (anyone else with a sign-in account)</label><select id="ap_def">${opt(ROLES.filter(r=>r!=="Admin"),settingsDoc().defaultRole||"Viewer")}</select></div></div>
   <div><h2 class="sec" style="margin-top:0">What each role can do</h2><div class="alist">${ROLES.map(r=>`<div class="aitem" style="--c:${ROLE_C[r]};cursor:default"><span class="stripe"></span><div style="min-width:0"><div class="t">${r}</div><div class="s" style="white-space:normal">${ROLE_INFO[r]}</div></div><span class="mono muted">${r==="Admin"?(M.filter(m=>m.role==="Admin").length+(S.me?.isOwner?1:0)):M.filter(m=>m.role===r).length}</span></div>`).join("")}</div>
   <div class="banner" style="margin-top:14px"><span>Roles control what each person can do. Who can sign in at all is managed under <b>Accounts</b> at the bottom of the sidebar, where you can create accounts, reset passwords and suspend people. Then set their role here.</span></div></div></div>`;
  setTimeout(fillPeople,0);return h}
function apLists(){const L=k=>LIST(k,DEF_LISTS[k]).join("\n");const F=[["reqTypes","Req. types"],["funcModules","Functional modules"],["branches","Branches / divisions"],["endUsers","End-user teams"],["licTypes","Licence types"]];
  return `<p class="muted" style="margin:0 0 14px">These lists fill the dropdowns and suggestions across the tracker. One value per line.</p><div class="modgrid" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">${F.map(([k,l])=>`<div class="mod" style="--mc:var(--accent)"><div class="field"><label for="ls_${k}" style="font:700 14px var(--display);color:var(--fg)">${l}</label><textarea id="ls_${k}" style="min-height:190px;font:13px var(--mono)">${esc(L(k))}</textarea></div></div>`).join("")}</div><div style="margin-top:14px;display:flex;gap:8px"><button class="btn primary" type="button" id="ls_save">Save lists</button><button class="btn" type="button" id="ls_reset">Restore defaults</button></div>`}
function apLog(){const A=(S.audit||[]).slice().sort((a,b)=>a.date<b.date?1:-1);const rows=A.flatMap(doc=>(doc.e||[]).map(e=>({...e,u:doc.user}))).sort((a,b)=>a.t<b.t?1:-1);const f=S.alf||(S.alf={c:"",q:""});
  const R=rows.filter(r=>(!f.c||r.c===f.c)&&(!f.q||(r.l||"").toLowerCase().includes(f.q.toLowerCase())));const AL={create:"Created",update:"Updated",delete:"Deleted",note:"Note"};
  const h=`<div class="filters"><input id="al_q" type="search" placeholder="Search activity…" value="${esc(f.q)}"><select id="al_c"><option value="">All areas</option>${["items","developers","users","licenses","companies","rollout","modules","daily","manuals","members","settings"].map(c=>`<option ${f.c===c?"selected":""}>${c}</option>`).join("")}</select><button class="btn" type="button" id="al_dl">⇩ Download log</button></div>
   ${R.length?`<div class="tablewrap"><table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Area</th><th>What</th></tr></thead><tbody>${R.slice(0,400).map(r=>`<tr><td class="mono" style="white-space:nowrap">${new Date(r.t).toLocaleString(undefined,{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}</td><td>${personCell(r.u)}</td><td><span class="chip" style="--c:${r.a==="delete"?"var(--bad)":r.a==="create"?"var(--ok)":r.a==="note"?"var(--accent)":"var(--info)"}">${AL[r.a]||r.a}</span></td><td class="muted">${esc(r.c||"")}</td><td>${esc(r.l||"")}</td></tr>`).join("")}</tbody></table></div><p class="muted" style="font-size:12px">Showing ${Math.min(400,R.length)} of ${R.length} entries from the last ${A.length} person-days. Recording started today.</p>`:empty("No activity yet","Every create, change and delete made in the tracker is recorded here with who did it and when.")}`;
  setTimeout(fillPeople,0);return h}
function apData(){const d=data();const C=[["items","Development items"],["developers","Developers"],["users","Application users"],["licenses","Licence lines"],["companies","Companies"],["rollout","Rollout cells"],["modules","Projects"],["daily","Daily notes"],["manuals","User manuals"],["members","Members"]];
  const src=Object.entries(d.items.reduce((a,i)=>{if(i.source)a[i.source]=(a[i.source]||0)+1;return a},{}));
  return `<div class="kpis">${C.map(([k,l])=>`<div class="kpi"><div class="n">${(S[k]||[]).length}</div><div class="l">${l}</div></div>`).join("")}</div>
   <h2 class="sec">Backup</h2><div class="banner"><span>Download everything in the tracker as one Excel workbook, or as a JSON backup file that keeps every field.</span><button class="btn" type="button" data-act="export">⇩ Excel workbook</button><button class="btn primary" type="button" id="bk_json">⇩ JSON backup</button></div>
   <h2 class="sec">Imported files</h2>${src.length?`<div class="tablewrap"><table><thead><tr><th>File</th><th class="num">Items</th><th></th></tr></thead><tbody>${src.map(([f,n])=>`<tr><td>${esc(f)}</td><td class="num">${n}</td><td style="text-align:right"><button class="btn danger" type="button" data-delsrc="${esc(f)}">Delete these items…</button></td></tr>`).join("")}</tbody></table></div>`:`<p class="muted">No imported items.</p>`}
   <h2 class="sec">Clear a project's items</h2><div class="tablewrap"><table><thead><tr><th>Project</th><th class="num">Items</th><th></th></tr></thead><tbody>${d.modules.map(m=>{const n=d.items.filter(i=>i.module===m.id).length;return `<tr><td>${modTag(m.id)}</td><td class="num">${n}</td><td style="text-align:right">${n?`<button class="btn danger" type="button" data-delproj="${m.id}">Delete all items…</button>`:""}</td></tr>`}).join("")}</tbody></table></div>`}
function confirmBulk(title,list,onGo){const p=panel(`<h2>${esc(title)}</h2><p>This permanently deletes <b>${list.length}</b> item${list.length===1?"":"s"}. Download an Excel or JSON backup first if you may need them.</p><div class="field"><label for="cb_in">Type DELETE to confirm</label><input id="cb_in" autocomplete="off"></div><div class="foot"><span></span><div><button class="btn" type="button" id="cb_c">Cancel</button><button class="btn danger armed" type="button" id="cb_go" disabled>Delete ${list.length}</button></div></div>`);
  const inp=p.querySelector("#cb_in"),go=p.querySelector("#cb_go");inp.oninput=()=>go.disabled=inp.value.trim()!=="DELETE";p.querySelector("#cb_c").onclick=dismiss;
  go.onclick=async()=>{go.disabled=true;S.mute++;try{await runPool(list.map(i=>()=>del("items",i.id)),k=>go.textContent=`Deleting ${k}/${list.length}…`);S.mute--;auditNote(`${title}: ${list.length} items deleted`);close();toast(`Deleted ${list.length} items`)}catch(e){S.mute--;go.disabled=false;writeErr(e)}}}
async function backupJson(){const out={exported:new Date().toISOString()};["modules","developers","items","users","companies","licenses","rollout","daily","manuals","members","settings"].forEach(k=>out[k]=(S[k]||[]));
  if(!S.dl){toast("Downloads aren't available in this view.");return}try{const r=await S.dl.save({filename:`Dev360_Backup_${today()}.json`,data:new Blob([JSON.stringify(out,null,1)],{type:"application/json"})});if(r?.status==="saved")toast("Backup downloaded")}catch(e){if(e?.code!=="cancelled"&&e?.code!=="declined")toast("Download didn't complete")}}
let apSearchT=null;
function bindPanel(){
  $("#ap_def")?.addEventListener("change",async e=>{try{const o={...settingsDoc(),defaultRole:e.target.value};delete o.id;await put("settings","lists",o);toast("Default role saved")}catch(x){writeErr(x)}});
  const si=$("#ap_search"),res=$("#ap_results");
  si?.addEventListener("input",()=>{clearTimeout(apSearchT);apSearchT=setTimeout(async()=>{const q=si.value.trim();if(!S.user||!q){res.hidden=true;return}let hits=[];try{hits=await S.user.search(q)}catch(e){}
    res.innerHTML=hits.length?hits.slice(0,8).map(p=>`<div class="aitem" data-addm="${esc(p.id)}" style="--c:var(--accent)"><span class="stripe"></span><div style="min-width:0"><div class="t"></div><div class="s">${p.guest?"Guest · ":""}${memberOf(p.id)?"Already a member":"Add as Viewer, then change the role"}</div></div><span class="mono muted">+</span></div>`).join(""):`<div class="aitem" style="--c:var(--line);cursor:default"><span class="stripe"></span><div class="s" style="padding:4px 0">No accounts found. Create one under Accounts (bottom of the sidebar) first.</div><span></span></div>`;
    [...res.querySelectorAll("[data-addm]")].forEach((el,ix)=>el.querySelector(".t").textContent=hits[ix].name||"Team member");res.hidden=false},250)});
  si?.addEventListener("focus",()=>{if(si.value)si.dispatchEvent(new Event("input"))});
  $("#ls_save")?.addEventListener("click",async()=>{const o={...settingsDoc()};delete o.id;Object.keys(DEF_LISTS).forEach(k=>{const v=$("#ls_"+k)?.value.split("\n").map(s=>s.trim()).filter(Boolean);if(v)o[k]=[...new Set(v)]});try{await put("settings","lists",o);toast("Lists saved")}catch(e){writeErr(e)}});
  $("#ls_reset")?.addEventListener("click",()=>Object.keys(DEF_LISTS).forEach(k=>{const el=$("#ls_"+k);if(el)el.value=DEF_LISTS[k].join("\n")}));
  $("#al_q")?.addEventListener("input",e=>{S.alf.q=e.target.value;const pos=e.target.selectionStart;render();const n=$("#al_q");n?.focus();try{n.setSelectionRange(pos,pos)}catch(x){}});
  $("#al_c")?.addEventListener("change",e=>{S.alf.c=e.target.value;render()});
  $("#al_dl")?.addEventListener("click",()=>{if(typeof XLSX==="undefined")return;const rows=(S.audit||[]).flatMap(doc=>(doc.e||[]).map(e=>({"When":e.t,"Person id":doc.user,"Action":e.a,"Area":e.c,"What":e.l}))).sort((a,b)=>a.When<b.When?1:-1);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,sheet(rows,["When","Person id","Action","Area","What"]),"Activity");saveFile(`Dev360_Activity_${today()}.xlsx`,XLSX.write(wb,{bookType:"xlsx",type:"array"}))});
  $("#bk_json")?.addEventListener("click",backupJson);
}
document.addEventListener("change",async e=>{const t=e.target;
  if(t.dataset.mrole){const m=memberOf(t.dataset.mrole);if(!m)return;try{await put("members",m.id,{...m,role:t.value,id:undefined});toast("Role updated")}catch(x){writeErr(x);render()}}
  if(t.dataset.mdev!=null&&t.dataset.mdev!==""){const m=memberOf(t.dataset.mdev);if(!m)return;try{await put("members",m.id,{...m,devId:t.value,id:undefined});toast("Linked developer saved")}catch(x){writeErr(x);render()}}});
document.addEventListener("click",async e=>{const t=e.target;
  const ap=t.closest("[data-ap]");if(ap){S.ap=ap.dataset.ap;render();return}
  const am=t.closest("[data-addm]");if(am){const id=am.dataset.addm;if(memberOf(id)){toast("Already a member");return}try{await put("members",id,{role:"Viewer",devId:"",active:true,addedOn:today()});toast("Added as Viewer. Set their role in the list.")}catch(x){writeErr(x)}return}
  const ma=t.closest("[data-mact]");if(ma){const m=memberOf(ma.dataset.mact);try{await put("members",m.id,{...m,active:m.active===false,id:undefined});toast(m.active===false?"Reactivated":"Suspended")}catch(x){writeErr(x)}return}
  const md=t.closest("[data-mdel]");if(md){if(!md.classList.contains("armed")){md.classList.add("armed");md.textContent="Click to confirm";setTimeout(()=>{md.classList.remove("armed");md.textContent="Remove"},3000);return}try{await del("members",md.dataset.mdel);toast("Member removed")}catch(x){writeErr(x)}return}
  const ds=t.closest("[data-delsrc]");if(ds){confirmBulk(`Delete items imported from ${ds.dataset.delsrc}`,S.items.filter(i=>i.source===ds.dataset.delsrc));return}
  const dp=t.closest("[data-delproj]");if(dp){confirmBulk(`Delete all ${modById(dp.dataset.delproj)?.name} items`,S.items.filter(i=>i.module===dp.dataset.delproj));return}
  if(!t.closest("#ap_search")&&!t.closest("#ap_results")){const r=$("#ap_results");if(r)r.hidden=true}});

// ----- Messaging (email / WhatsApp), notification settings, reminders
const APP_LINK=location.origin;
const TPL_DEF={
  daily:{label:"Daily update reminder",subject:"Daily status update – {date}",body:"Hi {name},\n\nPlease update your daily status in ERAM HCM Business Tools for {date}: what you completed, your plan for tomorrow and any blockers.\n\nYour open items:\n{items}\n\n{link}"},
  overdue:{label:"Overdue items",subject:"Overdue items – {date}",body:"Hi {name},\n\nThese items are past their due date:\n{overdue}\n\nPlease update their status or share the new expected date.\n\n{link}"},
  assign:{label:"Task assignment",subject:"New assignment: {item}",body:"Hi {name},\n\nYou have been assigned: {item} ({project}).\nDue: {due}\n\nPlease review it and keep the status updated.\n\n{link}"},
  summary:{label:"Status summary",subject:"Development status – {date}",body:"Development status for {date}\n\n{summary}\n\n{link}"},
  custom:{label:"Custom message",subject:"ERAM HCM Business Tools",body:"Hi {name},\n\n\n\n{link}"}};
const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const notifyCfg=()=>{const n=(S.settings||[]).find(x=>x.id==="notify")||{};return{managerName:n.managerName||"",managerEmail:n.managerEmail||"",managerWa:n.managerWa||"",link:n.link||APP_LINK,dailyTime:n.dailyTime||"17:00",days:Array.isArray(n.days)?n.days:[0,1,2,3,4],dailyOn:n.dailyOn!==false,overdueOn:n.overdueOn!==false,tpl:Object.fromEntries(Object.keys(TPL_DEF).map(k=>[k,{...TPL_DEF[k],...((n.tpl||{})[k]||{})}]))}};
const nowHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const waDigits=v=>String(v||"").replace(/[^0-9]/g,"").replace(/^00/,"");
function fillTpl(t,vars){return String(t||"").replace(/\{(\w+)\}/g,(m,k)=>vars[k]!=null?vars[k]:m)}
function devVars(v,extra={}){const d=data();const D=today();const L=d.items.filter(i=>hasDev(i,v.id)&&i.status!=="done");const ov=L.filter(i=>i.due&&i.due<D);
  const line=i=>`• ${i.title}${modById(i.module)?` [${modById(i.module).name}]`:""}${i.due?` – due ${i.due}`:""}`;
  return{name:(v.name||"").split(" ")[0]||v.name,fullname:v.name,date:fmtD(D),items:L.length?L.slice(0,12).map(line).join("\n")+(L.length>12?`\n…and ${L.length-12} more`:""):"• No open items",overdue:ov.length?ov.map(line).join("\n"):"• None",link:notifyCfg().link,summary:summaryText(),...extra}}
function summaryText(){const d=data();const D=today();const I=d.items;return d.modules.map(m=>{const L=I.filter(i=>i.module===m.id);if(!L.length)return"";return `${m.name}: ${pctOf(L)}% · ${L.filter(i=>i.status==="done").length} done · ${L.filter(i=>ACTIVE.includes(i.status)).length} in progress · ${L.filter(i=>i.status==="pending").length} open${L.filter(i=>i.status!=="done"&&i.due&&i.due<D).length?` · ${L.filter(i=>i.status!=="done"&&i.due&&i.due<D).length} overdue`:""}`}).filter(Boolean).join("\n")}
// composer
function openCompose(o={}){const d=data();const cfg=notifyCfg();const st={tpl:o.tpl||"daily",sel:new Set(o.devIds||[]),mgr:!!o.mgr,item:o.itemId?d.items.find(i=>i.id===o.itemId):null};
  let subj=o.subject||cfg.tpl[st.tpl].subject,body=o.body||cfg.tpl[st.tpl].body;
  const p=panel(`<h2>Send a message</h2><p class="muted" style="margin:0">Choose who gets it, check the text, then open WhatsApp or email for each person. The text is filled in for you; you press Send in WhatsApp or your email app.</p>
   <form class="form"><div class="field"><label for="mc_tpl">Message type</label><select id="mc_tpl">${opt(Object.entries(cfg.tpl).map(([k,v])=>[k,v.label]),st.tpl)}</select></div><div class="field"><label for="mc_subj">Email subject</label><input id="mc_subj" value="${esc(subj)}"></div>
   <div class="field full"><label for="mc_body">Message <span class="muted" style="font-weight:500">· {name} {items} {overdue} {date} {link} are filled in per person</span></label><textarea id="mc_body" style="min-height:170px">${esc(body)}</textarea></div></form>
   <div class="grouph" style="margin:4px 0 0"><h3 style="flex:1">Recipients</h3><button class="btn" type="button" id="mc_all">Select all</button><button class="btn" type="button" id="mc_none">Deselect all</button></div>
   <div id="mc_list" class="tablewrap"></div><div id="mc_bulk"></div>
   <div class="foot"><span class="muted" style="font-size:12px">If a button doesn't open anything, use Copy and paste the text.</span><div><button class="btn" type="button" id="mc_c">Close</button></div></div>`,true);
  const recips=()=>[...d.developers.map(v=>({id:v.id,name:v.name,email:v.email,wa:v.whatsapp,v})),...(o.extra||[]),...(cfg.managerName||cfg.managerEmail||cfg.managerWa?[{id:"_mgr",name:cfg.managerName||"Manager",email:cfg.managerEmail,wa:cfg.managerWa,v:{id:"_mgr",name:cfg.managerName||"Manager"}}]:[])];
  if(st.mgr)st.sel.add("_mgr");(o.extra||[]).forEach(r=>st.sel.add(r.id));
  const varsFor=r=>{const it=st.item;return devVars(r.v,it?{item:it.title,project:modById(it.module)?.name||"",due:it.due?fmtD(it.due):"not set"}:{item:"",project:"",due:""})};

function vHealth(){const C=healthChecks();const tot=C.reduce((a,c)=>a+c[2].length,0);
  let h=`<p class="muted" style="margin:0 0 14px">Gaps that make the status report less reliable. Fix them in bulk where a button is offered, or open each item.</p><div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">${[[tot,"Things to fix",tot>0],[C.filter(c=>!c[2].length).length+"/"+C.length,"Checks passing"]].map(([n,l,b])=>`<div class="kpi ${b?"bad":""}"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("")}</div><div class="alist" style="margin-top:16px">`;

function openBulkFix(k){const c=healthChecks().find(x=>x[0]===k);if(!c)return;const [,label,L,field]=c;const d=data();

    S.mute++;try{await runPool(L.map(i=>()=>put("items",i.id,{...i,...patch(i)})),k=>btn.textContent=`Saving ${k}/${L.length}…`);S.mute--;auditNote(`Bulk fix "${label}" on ${L.length} items`);close();toast(`Updated ${L.length} items`)}catch(e){S.mute--;btn.disabled=false;writeErr(e)}}}

function fileLinks(x,col){const F=x.files||[];return `<div style="display:flex;flex-direction:column;gap:6px">${F.map(f=>`<div style="display:flex;gap:8px;align-items:center;font-size:13px">${/^image\//.test(f.type)?`<img src="/_blob/${esc(f.id)}" alt="" style="width:40px;height:40px;object-fit:cover;border-radius:6px;border:1px solid var(--line)">`:`<span class="mtag" style="--mc:var(--info)">${esc((f.name.split(".").pop()||"file").toUpperCase().slice(0,4))}</span>`}<a href="/_blob/${esc(f.id)}" target="_blank" rel="noopener" style="color:var(--accent);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</a><span class="muted mono" style="font-size:11px">${Math.max(1,Math.round((f.size||0)/1024))} KB</span>${canManage()?`<button class="btn" type="button" data-fdel="${col}|${x.id}|${esc(f.id)}" style="padding:2px 8px">✕</button>`:""}</div>`).join("")||'<span class="muted" style="font-size:13px">No files attached.</span>'}${S.assets?`<label class="btn" style="align-self:flex-start;cursor:pointer">📎 Attach file<input type="file" data-fup="${col}|${x.id}" hidden accept="image/*,application/pdf,video/*,.csv,.txt,.md,.json,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip"></label><span class="muted" style="font-size:11px">Images, PDF, video, CSV or text up to 20 MB. Word, Excel and PowerPoint files are fine too.</span>`:'<span class="muted" style="font-size:12px">Viewers can\'t attach files.</span>'}</div>`}
function timeBlock(i){const T=i.time||[];const act=T.reduce((a,t)=>a+(+t.h||0),0);const est=+i.estHours||0;const d=data();
  return `<div style="display:flex;gap:14px;font-size:13px;margin-bottom:6px"><span>Logged <b>${act.toFixed(1)} h</b></span><span>Estimate <b>${est||"—"}${est?" h":""}</b></span>${est?`<span style="color:${act>est?"var(--bad)":"var(--ok)"}">${act>est?"Over by "+(act-est).toFixed(1)+" h":(est-act).toFixed(1)+" h left"}</span>`:""}</div>${T.length?`<div style="max-height:130px;overflow:auto;font-size:12.5px;display:flex;flex-direction:column;gap:3px;margin-bottom:6px">${T.slice().reverse().map(t=>`<div><span class="mono muted">${fmtD(t.d)}</span> · <b>${t.h} h</b> · ${esc(devById(t.dev)?.name||"")}${t.n?" · "+esc(t.n):""}</div>`).join("")}</div>`:""}
   <div style="display:grid;grid-template-columns:110px 70px 1fr ${canManage()?"130px ":""}auto;gap:6px;align-items:center"><input id="tl_d" type="date" value="${today()}" style="font:13px var(--body);padding:6px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);color:var(--fg)"><input id="tl_h" type="number" min="0.25" step="0.25" placeholder="Hours" style="font:13px var(--body);padding:6px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);color:var(--fg)"><input id="tl_n" placeholder="What was done" style="font:13px var(--body);padding:6px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);color:var(--fg);min-width:0">${canManage()?`<select id="tl_dev" style="font:13px var(--body);padding:6px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);color:var(--fg)">${opt(d.developers.map(v=>[v.id,v.name]),myDevId()||devsOf(i)[0]||"")}</select>`:""}<button class="btn" type="button" id="tl_add" data-tlitem="${i.id}">+ Log</button></div>`}
async function addTime(id){const i=S.items.find(x=>x.id===id);const h=+$("#tl_h").value;if(!i||!h){toast("Enter hours");return}const dv=$("#tl_dev")?.value||myDevId()||devsOf(i)[0]||"";const T=[...(i.time||[]),{d:$("#tl_d").value||today(),h,dev:dv,n:$("#tl_n").value.trim()}].slice(-200);
  try{S.mute++;await put("items",id,{...i,time:T});S.mute--;i.time=T;const box=$("#tl_box");if(box)box.innerHTML=timeBlock(i);toast(`${h} h logged`)}catch(e){S.mute=Math.max(0,S.mute-1);writeErr(e)}}
async function uploadFile(col,id,file){const x=(S[col]||[]).find(r=>r.id===id);if(!x||!S.assets)return;if(file.size>20*1024*1024){toast("File is larger than 20 MB");return}toast("Uploading "+file.name+"…");
  try{const r=await S.assets.upload(file);const files=[...(x.files||[]),{id:r.id,name:file.name,type:r.contentType||file.type,size:r.sizeBytes||file.size,t:new Date().toISOString(),by:S.me?.id||""}];await put(col,id,{...x,files});x.files=files;const box=$("#fl_box");if(box)box.innerHTML=fileLinks(x,col);toast("Attached "+file.name)}
  catch(e){toast(e?.code==="unsupported_type"?"This file type can't be attached. Save it as PDF or an image.":e?.code==="too_large"?"File is too large":e?.code==="not_granted"||e?.code==="not_uploader"?"You don't have permission to attach files":"Upload failed: "+(e?.message||e?.code||e))}}

function openReconcile(){const p=panel(`<h2>Reconcile with SAP users</h2><p class="muted" style="margin:0">In SAP Business One, export the user list with each user's licence type (License Administration → export, or a query on OUSR with the licence assignments) as Excel or CSV. Columns recognised: <b>User Code</b>, <b>User Name</b>, <b>Email</b>, <b>License Type</b>.</p>
  <label class="drop" for="rc_f"><b>Choose the SAP export</b><br><span style="font-size:12px">.xlsx · .xls · .csv</span></label><input id="rc_f" type="file" accept=".xlsx,.xls,.csv" hidden><div id="rc_out"></div><div class="foot"><span></span><div><button class="btn" type="button" id="rc_c">Close</button></div></div>`,true);
  p.querySelector("#rc_c").onclick=dismiss;p.querySelector("#rc_f").onchange=e=>{const f=e.target.files[0];if(!f)return;if(typeof XLSX==="undefined"){toast("The Excel reader didn't load.");return}const r=new FileReader();r.onload=()=>{try{const wb=XLSX.read(r.result,{type:"array"});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});reconcile(p,rows)}catch(x){p.querySelector("#rc_out").innerHTML=`<p class="err">Couldn't read the file: ${esc(x.message)}</p>`}};r.readAsArrayBuffer(f)}}
function reconcile(p,rows){const d=data();const pools=d.licenses.filter(l=>/sap/i.test(l.software));const pick=(r,...a)=>{const k=Object.keys(r).find(k=>a.includes(norm(k)));return k?String(r[k]).trim():""};
  const sap=rows.map(r=>({code:pick(r,"usercode","user","username","usercd","code","userid"),name:pick(r,"username","name","fullname","uname"),email:pick(r,"email","emailaddress","mail"),type:pick(r,"licensetype","licencetype","license","licence","type")})).filter(r=>r.code||r.name).map(r=>({...r,name:r.name||r.code}));
  const tUsers=d.users.filter(u=>userPools(u).some(pl=>/sap/i.test(pl.software)));const key=s=>norm(s);
  const match=s=>d.users.find(u=>(u.sapCode&&key(u.sapCode)===key(s.code))||(s.email&&u.email&&key(u.email)===key(s.email))||key(u.name)===key(s.name));
  const typeOf=s=>pools.find(pl=>norm(s.type).includes(norm(pl.type))||norm(pl.type).includes(norm(s.type)));
  const rowsOut=sap.map(s=>{const u=match(s);const tp=typeOf(s);const held=u?userPools(u).find(pl=>/sap/i.test(pl.software)):null;return{s,u,tp,held,state:!u?"missing":!held?"nolic":tp&&held.id!==tp.id?"mismatch":"ok"}});
  const notInSap=tUsers.filter(u=>!rowsOut.some(r=>r.u?.id===u.id));const bySap={};sap.forEach(s=>{const k=typeOf(s)?.type||s.type||"Unknown";bySap[k]=(bySap[k]||0)+1});
  const C={ok:rowsOut.filter(r=>r.state==="ok").length,missing:rowsOut.filter(r=>r.state==="missing"),nolic:rowsOut.filter(r=>r.state==="nolic"),mismatch:rowsOut.filter(r=>r.state==="mismatch")};
  p.querySelector("#rc_out").innerHTML=`<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${[[sap.length,"Users in SAP"],[C.ok,"Match the tracker"],[C.missing.length,"In SAP, not in tracker",C.missing.length],[C.nolic.length+C.mismatch.length,"Licence differs",C.nolic.length+C.mismatch.length],[notInSap.length,"Licence here, no SAP user",notInSap.length]].map(([n,l,b])=>`<div class="kpi ${b?"bad":""}"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("")}</div>
   <h3 style="margin:16px 0 8px">Licence count: SAP vs purchased</h3><div class="tablewrap"><table><thead><tr><th>Type</th><th class="num">Used in SAP</th><th class="num">Purchased</th><th class="num">Difference</th></tr></thead><tbody>${[...new Set([...pools.map(pl=>pl.type),...Object.keys(bySap)])].map(t=>{const q=pools.filter(pl=>pl.type===t).reduce((a,pl)=>a+(+pl.qty||0),0),u=bySap[t]||0;return `<tr><td>${esc(t)}</td><td class="num">${u}</td><td class="num">${q}</td><td class="num" style="${u>q?"color:var(--bad);font-weight:700":""}">${q-u>=0?(q-u)+" free":(u-q)+" over"}</td></tr>`}).join("")}</tbody></table></div>
   ${C.missing.length?`<div class="grouph"><h3 style="flex:1">In SAP but not in the tracker (${C.missing.length})</h3>${canManage()?`<button class="btn primary" type="button" id="rc_add">Add them as users with their licence</button>`:""}</div><div class="tablewrap" style="max-height:220px;overflow:auto"><table><tbody>${C.missing.map(r=>`<tr><td class="mono">${esc(r.s.code)}</td><td>${esc(r.s.name)}</td><td class="muted">${esc(r.s.email)}</td><td>${esc(r.s.type)}</td></tr>`).join("")}</tbody></table></div>`:""}
   ${C.nolic.length+C.mismatch.length?`<div class="grouph"><h3 style="flex:1">Licence type differs (${C.nolic.length+C.mismatch.length})</h3>${canManage()?`<button class="btn" type="button" id="rc_fix">Set tracker to match SAP</button>`:""}</div><div class="tablewrap" style="max-height:220px;overflow:auto"><table><tbody>${[...C.nolic,...C.mismatch].map(r=>`<tr><td>${esc(r.u.name)}</td><td class="muted">Tracker: ${esc(r.held?.type||"none")}</td><td>SAP: <b>${esc(r.s.type||"?")}</b></td></tr>`).join("")}</tbody></table></div>`:""}
   ${notInSap.length?`<h3 style="margin:16px 0 8px">Licence assigned here but no SAP user (${notInSap.length}). These may be free to reuse.</h3><div class="tablewrap" style="max-height:200px;overflow:auto"><table><tbody>${notInSap.map(u=>`<tr data-edituser="${u.id}" class="click"><td>${esc(u.name)}</td><td class="muted">${esc(userPools(u).map(pl=>pl.type).join(", "))}</td></tr>`).join("")}</tbody></table></div>`:""}`;
  p.querySelector("#rc_add")?.addEventListener("click",async e=>{const b=e.target;b.disabled=true;const sapMod=d.modules.find(m=>/sap/i.test(m.name))?.id;S.mute++;try{await runPool(C.missing.map(r=>()=>{const tp=r.tp;const apps=sapMod?{[sapMod]:{role:"",on:today()}}:{};return put("users",newId(),{name:r.s.name,email:r.s.email,sapCode:r.s.code,utype:"Business user",status:"Active",company:"",branch:"",dept:"",designation:"",apps,lic:tp?{[tp.id]:{on:today()}}:{}})}));S.mute--;auditNote(`Added ${C.missing.length} users from SAP reconciliation`);toast(`Added ${C.missing.length} users`);close()}catch(x){S.mute--;b.disabled=false;writeErr(x)}});
  p.querySelector("#rc_fix")?.addEventListener("click",async e=>{const b=e.target;b.disabled=true;S.mute++;try{await runPool([...C.nolic,...C.mismatch].filter(r=>r.tp).map(r=>()=>{const lic={...licOf(r.u)};Object.keys(lic).forEach(pid=>{if(/sap/i.test(poolById(pid)?.software||""))delete lic[pid]});lic[r.tp.id]={on:today()};return put("users",r.u.id,{...r.u,sapCode:r.u.sapCode||r.s.code,lic})}));S.mute--;auditNote("Licence types aligned with SAP export");toast("Licences updated to match SAP");close()}catch(x){S.mute--;b.disabled=false;writeErr(x)}})}

  db.collection("audit").orderBy("date","desc").limit(120).onSnapshot(snap=>{S.audit=snap.docs.map(d=>({id:d.id,...d.data()}));if(S.tab==="panel")render()},()=>{});
  window.addEventListener("pagehide",()=>flushAudit());
  sub("items",()=>S.items.sort((a,b)=>(a.due||"9999")<(b.due||"9999")?-1:1));
